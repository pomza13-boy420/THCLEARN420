<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>POM Organic Mix</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* โทนสี: ดำ ทองเมทัลลิค */
  :root {
    --bg: #070707; --card: #131210; --card2: #1e1b16;
    --text: #f3ecd9; --hint: #9c927a;
    --gold: #d4af37; --gold-soft: #f6e08a;
    --metal: linear-gradient(135deg, #8a6a1f 0%, #f6e08a 28%, #c9a23f 50%, #fff3b0 72%, #a47a1e 100%);
    --ink: #1a1304;   /* ตัวหนังสือบนพื้นทอง */
    --line: rgba(212, 175, 55, .28);
    --shadow: 0 6px 18px rgba(0, 0, 0, .55);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Noto Sans Thai", "Leelawadee UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.55; }
  body { padding: 0 16px 160px; max-width: 640px; margin: 0 auto; min-height: 100vh; }
  .gold { background: var(--metal); -webkit-background-clip: text; background-clip: text; color: transparent; }   /* หัวข้อและตัวเลขเด่น */
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; margin: 0 -16px;
    position: sticky; top: 0; background: #0d0b07; z-index: 5; }
  .brand { font-weight: 800; font-size: 17px; letter-spacing: .06em; }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button { background: none; border: 0; color: var(--hint); padding: 5px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .lang button.on { background: var(--metal); color: var(--ink); }
  .back { background: none; border: 0; color: var(--gold); font-size: 15px; padding: 4px 0 10px; cursor: pointer; font-family: inherit; }
  h1 { font-size: 24px; margin: 8px 0 4px; line-height: 1.25; text-align: center; letter-spacing: .02em; }
  h2 { font-size: 16px; margin: 20px 0 8px; color: var(--gold); letter-spacing: .04em; }
  p.sub { color: var(--hint); margin: 0 0 16px; font-size: 14px; text-align: center; }
  .rule { height: 2px; border-radius: 2px; background: var(--metal); width: 64px; margin: 8px auto 16px; }
  .view { display: none; padding-top: 14px; } .view.on { display: block; }
  #v-home { padding-top: 0; }

  /* ตารางเมนู / tile grids */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .tile { background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 18px; padding: 20px 10px; text-align: center; cursor: pointer; font: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 128px; }
  .tile:active { opacity: .85; }
  .tile.wide { grid-column: 1 / -1; }
  .tile .ico { font-size: 34px; width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; background: var(--card2); }
  .tile b { font-size: 17px; font-weight: 700; }
  .tile small { color: var(--hint); font-size: 12px; }
  /* หมวดสินค้า: กล่องดำขอบทอง */
  .tile.cat { background: linear-gradient(160deg, var(--card2), var(--card)); box-shadow: var(--shadow); }
  .tile.cat .ico { background: radial-gradient(circle at 30% 25%, #3a2f12, #0d0b06); border: 1px solid var(--line); }

  /* รายการสินค้า / item cards */
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer;
    color: var(--text); font: inherit; padding: 0; text-align: center; display: flex; flex-direction: column; }
  .item:active { opacity: .85; }
  .pic { aspect-ratio: 1 / 1; width: 100%; display: grid; place-items: center; font-size: 54px; background: var(--card2); }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item .nm { font-weight: 700; font-size: 14px; padding: 10px 8px 2px; line-height: 1.3; }
  .item .pr { font-weight: 800; font-size: 15px; padding: 0 8px 12px; }
  .item .pr small, .price small { font-weight: 500; font-size: 12px; color: var(--hint); -webkit-text-fill-color: var(--hint); }

  /* รายละเอียด / detail */
  .hero { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; max-width: 300px; margin: 0 auto 14px; }
  .badge { display: inline-block; border: 1px solid var(--line); color: var(--gold); border-radius: 999px; padding: 3px 12px;
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .center { text-align: center; }
  .price { font-size: 26px; font-weight: 800; margin: 6px 0 2px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; margin: 14px 0 4px; }
  .stats div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .stats small { display: block; color: var(--hint); font-size: 11px; letter-spacing: .1em; }
  .stats b { font-size: 16px; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tags span { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-size: 13px; }

  /* แบรนด์ หน้าหลัก แถบเมนูล่าง / brand, home, bottom tab bar */
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand img { height: 30px; border-radius: 8px; background: #fff; padding: 2px 5px; display: block; }
  .logo { background: #fff; border-radius: 22px; padding: 10px 14px; max-width: 230px; margin: 6px auto 12px;
    border: 2px solid var(--gold); box-shadow: 0 8px 22px rgba(0, 0, 0, .6); }
  .logo img { width: 100%; display: block; }
  .hero-home { background: linear-gradient(180deg, #0d0b07 0%, #1c1608 100%); margin: 0 -16px; padding: 4px 16px 20px;
    border-radius: 0 0 22px 22px; border-bottom: 1px solid var(--line); }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .facts span { border: 1px solid var(--line); color: var(--gold-soft); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
  .points { margin-top: 14px; background: var(--metal); color: var(--ink); border-radius: 16px; padding: 12px 16px; box-shadow: var(--shadow); }
  .points b { display: block; font-size: 20px; }
  .points small { font-size: 12px; opacity: .85; }
  /* แถบเลื่อนโปรโมชั่น: ปัดซ้าย–ขวาได้ และเลื่อนเองทุก 4 วินาที */
  .slider { position: relative; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
    margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
  .slider::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 86%; scroll-snap-align: center; border-radius: 18px; padding: 16px; min-height: 122px;
    display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow);
    background: linear-gradient(135deg, #2a2110, #0f0d08); color: var(--text); border: 1px solid var(--line); }
  .slide.s0 { background: var(--metal); color: var(--ink); border: 0; }           /* ใบแรก: ทองเต็มใบ */
  .slide.s2 { background: linear-gradient(135deg, #4a3a16, #1a140a); }
  .slide .sico { font-size: 40px; flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(0, 0, 0, .2); border: 1px solid rgba(212, 175, 55, .4); }
  .slide b { display: block; font-size: 17px; line-height: 1.3; color: var(--gold-soft); }
  .slide.s0 b { color: inherit; }
  .slide p { margin: 3px 0 0; font-size: 13px; opacity: .92; }
  .slide .when { display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 10px;
    border: 1px solid currentColor; }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 6px; min-height: 7px; }
  .dots i { width: 7px; height: 7px; border-radius: 4px; background: var(--line); transition: width .2s; }
  .dots i.on { width: 18px; background: var(--gold); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start; }
  .card .cico { font-size: 24px; flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--card2); }
  .card b { display: block; font-size: 15px; }
  .card p { margin: 2px 0 0; font-size: 13px; color: var(--hint); }
  .card .when { display: inline-block; margin-top: 7px; font-size: 11px; font-weight: 800; color: var(--ink);
    background: var(--metal); border-radius: 999px; padding: 1px 10px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin: 0 auto 16px; max-width: 340px; }
  .seg button { flex: 1; background: none; border: 0; color: var(--hint); padding: 9px 6px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .seg button.on { background: var(--metal); color: var(--ink); }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center;
    background: #0d0b07; border-top: 1px solid var(--line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .tabbar button { flex: 1; max-width: 150px; background: none; border: 0; color: var(--hint); font: inherit; font-size: 11px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; cursor: pointer; }
  .tabbar span { font-size: 21px; line-height: 1.2; filter: grayscale(1) opacity(.55); }
  .tabbar b { font-weight: 700; }
  .tabbar button.on { color: var(--gold); }
  .tabbar button.on span { filter: none; }

  /* บัตรสมาชิก / member card */
  .mcard { background: var(--metal); color: var(--ink); border-radius: 20px; padding: 18px; margin-top: 6px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 255, 255, .5); }
  .mtop { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: .14em; }
  .mtype { background: var(--ink); color: var(--gold-soft); border-radius: 999px; padding: 3px 10px; letter-spacing: .02em; }
  .mname { font-size: 20px; font-weight: 800; margin: 16px 0 0; word-break: break-word; }
  .mpts { font-size: 14px; font-weight: 600; }
  .mpts b { font-size: 40px; font-weight: 800; margin-right: 6px; }
  .mdates { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; margin-top: 10px; }
  .mdates b { display: block; font-size: 13px; }
  .qrbox { display: flex; gap: 14px; align-items: center; }
  #qr { background: #fff; padding: 6px; border-radius: 8px; flex: none; line-height: 0; }
  #qr:empty { display: none; }
  .mid { font-size: 20px; font-weight: 800; letter-spacing: .08em; }
  .tile.info { cursor: default; min-height: 0; padding: 16px 8px; }
  .reward { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .reward div { flex: 1; font-size: 14px; }
  .reward small { display: block; color: var(--hint); font-size: 12px; }
  .reward button { background: var(--metal); color: var(--ink); border: 0; border-radius: 999px; padding: 8px 16px;
    font: inherit; font-weight: 800; font-size: 13px; cursor: pointer; }
  .reward button:disabled { background: none; border: 1px solid var(--line); color: var(--hint); cursor: default; }
  .calc { display: flex; align-items: center; gap: 10px; }
  .calc input { flex: 1; min-width: 0; }
  .calc b { white-space: nowrap; font-size: 16px; }
  .search { text-align: center; }
  .empty { color: var(--hint); text-align: center; font-size: 14px; margin-top: 18px; }

  /* สั่งซื้อและตะกร้า / ordering and cart */
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
  .row.tot { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 12px; font-size: 17px; }
  .row small { color: var(--hint); }
  .stepper { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 3px; flex: none; }
  .stepper button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--card2); color: var(--gold-soft);
    font: inherit; font-size: 20px; font-weight: 700; line-height: 1; cursor: pointer; }
  .stepper b { min-width: 34px; text-align: center; font-size: 16px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
  .opts button { flex: 1; min-width: 120px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 10px 8px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .opts button.on { background: var(--metal); color: var(--ink); border-color: transparent; }
  .optlabel { font-size: 12px; color: var(--hint); margin-top: 8px; }
  .line { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .line .what { flex: 1; min-width: 0; font-size: 14px; }
  .line .what b { display: block; font-size: 15px; }
  .line .what small { display: block; color: var(--hint); font-size: 12px; }
  .line .sum { font-weight: 800; white-space: nowrap; }
  .cartbar { position: fixed; left: 12px; right: 12px; bottom: calc(70px + env(safe-area-inset-bottom)); z-index: 9;
    max-width: 616px; margin: 0 auto; display: none; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--metal); color: var(--ink); border: 0; border-radius: 16px; padding: 13px 16px;
    font: inherit; font-weight: 800; font-size: 15px; cursor: pointer; box-shadow: var(--shadow); }
  .cartbar.show { display: flex; }

  .note { border: 1px solid var(--line); border-left: 3px solid var(--gold); background: var(--card);
    border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--hint); margin: 18px 0; }
  .note.c { text-align: center; border-left-width: 1px; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 14px 0 5px; }
  input[type=text], input[type=number], input[type=tel], textarea {
    width: 100%; background: var(--card); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px; font: inherit; }
  input:focus, textarea:focus { outline: none; border-color: var(--gold); }
  textarea { min-height: 76px; resize: vertical; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .checks label, .consent { display: flex; gap: 8px; align-items: flex-start; margin: 0; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 14px; }
  .consent { margin-top: 16px; font-size: 13px; }
  input[type=checkbox] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--gold); flex: none; }
  .btn { width: 100%; background: var(--metal); color: var(--ink); border: 0; border-radius: 12px;
    padding: 14px; font: inherit; font-weight: 800; margin-top: 18px; cursor: pointer; letter-spacing: .03em; }
  .btn.ghost { background: none; color: var(--gold); border: 1px solid var(--gold); }
  .err { color: #e5604f; font-size: 13px; margin-top: 10px; min-height: 18px; }
  .summary { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 14px; white-space: pre-wrap; }
  .topic { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .topic-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .topic-head b { flex: 1; font-size: 15px; }
  .play { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--metal); color: var(--ink);
    font-size: 16px; cursor: pointer; flex: none; }
  .play.playing { background: #e5604f; color: #fff; }
  .topic-body { padding: 0 14px 14px; font-size: 14px; }
  .topic-body ul { margin: 0; padding-left: 20px; }
  .topic-body li { margin-bottom: 4px; }
  #gate { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: grid; place-items: center; padding: 24px; text-align: center; }
  #gate .gbox { max-width: 360px; }
  #gate .big { font-size: 56px; }
  footer { color: var(--hint); font-size: 12px; text-align: center; margin-top: 28px; letter-spacing: .06em; }
</style>
</head>
<body>

<div id="gate">
  <div class="gbox">
    <div class="logo"><img src="logo.jpg" alt="POM Organic Mix"></div>
    <h1 class="gold" data-i18n="gateTitle"></h1>
    <p class="sub" data-i18n="gateText"></p>
    <button class="btn" id="gateYes" data-i18n="gateYes"></button>
    <button class="btn ghost" id="gateNo" data-i18n="gateNo"></button>
    <div class="lang" style="margin:18px auto 0; width:max-content">
      <button data-lang="th">ไทย</button><button data-lang="en">EN</button>
    </div>
  </div>
</div>

<header>
  <div class="brand"><img src="logo.jpg" alt=""><span class="gold">POM Organic Mix</span></div>
  <div class="lang">
    <button data-lang="th">ไทย</button><button data-lang="en">EN</button>
  </div>
</header>

<!-- HOME -->
<div class="view on" id="v-home">
  <div class="hero-home">
    <div class="logo"><img src="logo.jpg" alt="POM Organic Mix"></div>
    <div class="facts"><span data-i18n="fact1"></span><span data-i18n="fact2"></span><span>20+</span></div>
  </div>
  <div class="points"><b id="homePts"></b><small data-i18n="pointsGo"></small></div>
  <h2 data-i18n="promoTitle"></h2>
  <div class="slider" id="promos"></div>
  <div class="dots" id="promoDots"></div>
  <h2 data-i18n="eventTitle"></h2>
  <div id="events"></div>
  <div class="note c" data-i18n="homeNote"></div>
</div>

<!-- CATEGORIES -->
<div class="view" id="v-cats">
  <h1 class="gold" data-i18n="mFlowers"></h1>
  <div class="rule"></div>
  <input type="text" class="search" id="search" data-i18n-ph="searchPh" autocomplete="off">
  <div class="grid" id="catGrid"></div>
  <div class="grid" id="searchGrid"></div>
  <div class="empty" id="searchEmpty" style="display:none" data-i18n="searchNone"></div>
</div>

<!-- MEMBER -->
<div class="view" id="v-member">
  <h1 class="gold" data-i18n="mMember"></h1>
  <div class="rule"></div>
  <div id="member"></div>
</div>

<!-- ITEM LIST -->
<div class="view" id="v-list">
  <button class="back" data-go="cats" data-i18n="backCats"></button>
  <h1 class="gold" id="listTitle"></h1>
  <div class="rule"></div>
  <p class="sub" id="listSub"></p>
  <div class="grid" id="itemGrid"></div>
</div>

<!-- ITEM DETAIL -->
<div class="view" id="v-detail">
  <button class="back" data-go="list" data-i18n="backList"></button>
  <div id="detail"></div>
</div>

<!-- CART -->
<div class="view" id="v-cart">
  <button class="back" data-go="cats" data-i18n="backMenu"></button>
  <h1 class="gold" data-i18n="cTitle"></h1>
  <div class="rule"></div>
  <div id="cart"></div>
</div>

<!-- LEARN: คู่มือเสียง + ใบ ภ.ท.33 -->
<div class="view" id="v-learn">
  <h1 class="gold" data-i18n="learnTitle"></h1>
  <div class="rule"></div>
  <div class="seg">
    <button data-seg="guide" class="on" data-i18n="segGuide"></button>
    <button data-seg="pt33" data-i18n="segPt33"></button>
  </div>
  <div id="p-pt33" style="display:none">
  <p class="sub" data-i18n="ptSub"></p>
  <div class="note" data-i18n="ptNote"></div>
  <form id="ptForm" novalidate>
    <label data-i18n="fName"></label><input type="text" id="fName" autocomplete="name">
    <label data-i18n="fAge"></label><input type="number" id="fAge" inputmode="numeric" min="1" max="120">
    <label data-i18n="fPhone"></label><input type="tel" id="fPhone" autocomplete="tel">
    <label data-i18n="fSymptoms"></label>
    <div class="checks" id="symptoms"></div>
    <label data-i18n="fDetail"></label><textarea id="fDetail"></textarea>
    <label data-i18n="fMeds"></label><textarea id="fMeds"></textarea>
    <div class="consent"><input type="checkbox" id="fConsent"><span data-i18n="fConsent"></span></div>
    <div class="err" id="ptErr"></div>
    <button class="btn" type="submit" data-i18n="fSubmit"></button>
  </form>
  <div id="ptDone" style="display:none">
    <h2 data-i18n="ptDoneTitle"></h2>
    <div class="summary" id="ptSummary"></div>
    <p class="sub" style="margin-top:12px" data-i18n="ptDoneText"></p>
    <button class="btn ghost" id="ptAgain" data-i18n="ptAgain"></button>
  </div>
  </div>
  <div id="p-guide">
  <p class="sub" data-i18n="gSub"></p>
  <div id="topics"></div>
  <div class="note" data-i18n="gNote"></div>
  </div>
</div>

<footer data-i18n="footer"></footer>

function findItem(id) {
  for (const c of CATS) {
    const i = PRODUCTS[c.id].findIndex((p) => p.id === id);
    if (i >= 0) return { p: PRODUCTS[c.id][i], c, i };
  }
  return null;
}
function rollInfo(qty, roll) {   // จำนวนลำและค่าพันของรายการเดียว
  if (!roll) return { n: 0, fee: 0 };
  const s = SHOP.roll.sizes.find((x) => x.g === roll.size), f = SHOP.roll.filters.find((x) => x.id === roll.filter);
  if (!s || !f) return { n: 0, fee: 0 };
  const n = Math.floor(qty / s.g);
  return { n, fee: n * (s.fee + (f.fee || 0)) };
}
function totals() {   // สูตรเดียวกับในบอท (บอทคิดซ้ำจากราคาใน config.json เสมอ)
  let items = 0, roll = 0, grams = 0;
  cart.forEach((l) => {
    const it = findItem(l.id);
    if (!it || it.p.price == null) return;
    items += it.p.price * l.qty;
    roll += rollInfo(l.qty, l.roll).fee;
    if (it.p.unit !== "pc") grams += l.qty;
  });
  const min = SHOP.roll.freeMinGrams;
  const freeRoll = roll > 0 && min > 0 && grams >= min;
  const base = items + (freeRoll ? 0 : roll);
  const fee = pay === "card" ? Math.round(base * SHOP.cardFeePercent / 100) : 0;
  const g = SHOP.gift, per = g ? g.perGrams : 0;   // ของแถม: 1 ชิ้นต่อดอกทุก per กรัม
  const gift = per > 0 && items >= g.minBaht ? Math.floor(grams / per) : 0;
  return { items, roll, freeRoll, grams, fee, total: base + fee, gift, needG: per > 0 ? per - grams % per : 0 };
}

function promoIndex() {
  const s = $("#promos"), mid = s.scrollLeft + s.clientWidth / 2;
  let best = 0, dist = Infinity;
  $$("#promos .slide").forEach((k, i) => {
    const d = Math.abs(k.offsetLeft + k.offsetWidth / 2 - mid);
    if (d < dist) { dist = d; best = i; }
  });
  return best;
}
function promoGo(i) {
  const s = $("#promos"), k = $$("#promos .slide")[i];
  if (k) s.scrollTo({ left: k.offsetLeft - (s.clientWidth - k.offsetWidth) / 2, behavior: "smooth" });
}
function promoDots() {
  const i = promoIndex();
  $$("#promoDots i").forEach((d, n) => d.classList.toggle("on", n === i));
}
$("#promos").addEventListener("scroll", () => requestAnimationFrame(promoDots), { passive: true });

  const rolling = order.roll && it.unit !== "pc";
  const r = rollInfo(order.qty, rolling ? { size: order.size, filter: order.filter } : null);
  $("#oQty").textContent = order.qty;
  if ($("#oRoll")) {
    $("#oRoll").checked = order.roll;
    $("#oRollOpts").style.display = order.roll ? "" : "none";
    $$("#oRollOpts [data-size]").forEach((b) => b.classList.toggle("on", +b.dataset.size === order.size));
    $$("#oRollOpts [data-filter]").forEach((b) => b.classList.toggle("on", b.dataset.filter === order.filter));
    $("#oRollNote").textContent = r.n ? t("oRollNote")(r.n, r.fee) : t("oRollNone");
  }
  $("#oSum").textContent = "฿" + baht(it.price * order.qty + r.fee);
}
function addToCart() {
  const it = PRODUCTS[curCat][curItem];
  if (!it || it.price == null) return;
  const roll = order.roll && it.unit !== "pc" && rollInfo(order.qty, { size: order.size, filter: order.filter }).n
    ? { size: order.size, filter: order.filter } : null;
  const same = cart.find((l) => l.id === it.id && JSON.stringify(l.roll) === JSON.stringify(roll));
  if (same) same.qty = Math.min(99, same.qty + order.qty); else cart.push({ id: it.id, qty: order.qty, roll });
  saveCart();
  $("#oAdd").textContent = t("oAdded");
  setTimeout(() => { if ($("#oAdd")) $("#oAdd").textContent = t("oAdd"); }, 1400);
  if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {} }
}
function renderCart() {
  if (!menuLoaded || !cart.length) { $("#cart").innerHTML = `<div class="empty">${t("cEmpty")}</div>`; return; }
  const tt = totals(), min = SHOP.roll.freeMinGrams;
  const lines = cart.map((l, i) => {
    const it = findItem(l.id), p = it.p, r = rollInfo(l.qty, l.roll);
    const f = l.roll ? SHOP.roll.filters.find((x) => x.id === l.roll.filter) : null;
    return `<div class="line"><div class="what"><b>${esc(pick(p.name))}</b>
        <small>฿${baht(p.price)} × ${l.qty} ${t(p.unit === "pc" ? "uPc" : "uG")}</small>
        ${l.roll ? `<small>${esc(t("cRolled")(l.roll.size, r.n, f ? pick(f.label) : ""))} (+฿${baht(r.fee)})</small>` : ""}</div>
      <div class="stepper"><button data-cq="${i}:-1">−</button><b>${l.qty}</b><button data-cq="${i}:1">+</button></div>
      <span class="sum gold">฿${baht(p.price * l.qty)}</span></div>`;
  }).join("");
  const giftNote = !SHOP.gift || !tt.grams ? "" : `<div class="note">${tt.gift ? "🎁 " + t("cGift")(esc(pick(SHOP.gift.label)), tt.gift) + " · " : ""}${t("cGiftMore")(tt.needG, esc(pick(SHOP.gift.label)))}</div>`;
  const sh = SHOP.ship, hour = new Date(Date.now() + 7 * 3600 * 1000).getUTCHours();   // เวลาไทย
  const isNight = sh.night.fee > 0 && (sh.night.from <= sh.night.to ? hour >= sh.night.from && hour < sh.night.to : hour >= sh.night.from || hour < sh.night.to);
  const shipLine = method === "pickup" ? "" : `<div class="row"><span>${t("cShip")}</span><small style="text-align:right">${
    tt.items >= sh.freeMinBaht ? t("shipFree")(sh.freeKm, sh.perKm[0], sh.perKm[1]) : t("shipQuote")(sh.perKm[0], sh.perKm[1], baht(sh.freeMinBaht - tt.items))
  }${isNight ? "<br>" + t("shipNight")(sh.night.fee) : ""}</small></div>`;
  const payLabel = (m) => m === "card" ? t("payCard")(SHOP.cardFeePercent) : t({ cash: "payCash", qr: "payQr", btc: "payBtc" }[m]);
  $("#cart").innerHTML = `${lines}
    ${giftNote}
    ${tt.freeRoll ? `<div class="note">${t("cFree")(min)} (−฿${baht(tt.roll)})</div>`
      : (tt.roll > 0 && min > 0 ? `<div class="note">${t("cMore")(min - tt.grams)}</div>` : "")}
    ${sh.pickup ? `<h2>${t("cMethod")}</h2>
    <div class="opts">${["delivery", "pickup"].map((k) => `<button data-method="${k}" class="${method === k ? "on" : ""}">${t(k === "pickup" ? "mPickup" : "mDelivery")}</button>`).join("")}</div>` : ""}
    <h2>${t("cPay")}</h2>
    <div class="opts">${SHOP.pays.map((m) => `<button data-pay="${m}" class="${pay === m ? "on" : ""}">${payLabel(m)}</button>`).join("")}</div>
    <label>${t("cNote")}</label><textarea id="cNote" maxlength="300"></textarea>
    <div class="box" style="margin-top:14px">
      <div class="row"><span>${t("cItems")}</span><b>฿${baht(tt.items)}</b></div>
      ${tt.roll ? `<div class="row"><span>${t("cRoll")}</span><b>${tt.freeRoll ? `<s>฿${baht(tt.roll)}</s> ฿0` : "฿" + baht(tt.roll)}</b></div>` : ""}
      ${tt.fee ? `<div class="row"><span>${t("cCardFee")(SHOP.cardFeePercent)}</span><b>฿${baht(tt.fee)}</b></div>` : ""}
      ${shipLine}
      <div class="row tot"><span>${t(method === "pickup" ? "cTotal" : "cTotalNoShip")}</span><b class="gold">฿${baht(tt.total)}</b></div>
    </div>
    <button class="btn" id="cSend">${t("cSend")}</button>
    <p class="sub" style="margin-top:10px">${t(method === "pickup" ? "cPickupNote" : "cPayNote")}</p>`;
}
function sendOrder() {
  if (!cart.length) return;
  if (!(inTelegram && tg.sendData)) { alertMsg(t("cOnlyTg")); return; }
  const data = { order: { items: cart.map((l) => ({ id: l.id, q: l.qty, r: l.roll ? [l.roll.size, l.roll.filter] : 0 })),
                          pay, method, note: ($("#cNote").value || "").trim().slice(0, 300) }, lang };
  cart = []; store.set("cart", "[]");
  try { tg.sendData(JSON.stringify(data)); } catch (e) {}   // Telegram ปิดแอพเอง แล้วบอทส่งสรุปออเดอร์ในแชท
}

function renderSymptoms() {
  const checked = $$("#symptoms input").map((i) => i.checked);
  $("#symptoms").innerHTML = t("symptoms").map((s, i) =>
    `<label><input type="checkbox" value="${i}" ${checked[i] ? "checked" : ""}><span>${esc(s)}</span></label>`).join("");
}
function renderTopics() {
  $("#topics").innerHTML = TOPICS.map((tp, i) => `
    <div class="topic">
      <div class="topic-head"><span style="font-size:22px">${tp.ico}</span><b>${esc(pick(tp.title))}</b>
        <button class="play" data-topic="${i}" aria-label="play">▶</button></div>
      <div class="topic-body"><ul>${tp.points[lang].map((p) => `<li>${esc(p)}</li>`).join("")}</ul></div>
    </div>`).join("");
}

function applyLang() {
  stopAudio();
  document.documentElement.lang = lang;
  $$("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  $$("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  $$(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
  renderHome(); renderCats(); renderList(); renderDetail(); renderSearch(); renderMember(); renderSymptoms(); renderTopics();
  renderCart(); saveCart();
}
const TAB_OF = { home: "home", cats: "menu", list: "menu", detail: "menu", cart: "menu", learn: "learn", member: "member" };
function seg(which) {   // สลับ วิธีใช้ / ใบ ภ.ท.33 ในหน้าเรียนรู้
  stopAudio();
  $$(".seg button").forEach((b) => b.classList.toggle("on", b.dataset.seg === which));
  $("#p-guide").style.display = which === "guide" ? "" : "none";
  $("#p-pt33").style.display = which === "pt33" ? "" : "none";
}

function go(v) {
  stopAudio();
  view = v;
  if (v === "list") renderList();
  if (v === "detail") renderDetail();
  if (v === "cart") renderCart();
  saveCart();   // ซ่อน/แสดงแถบตะกร้า
  $$(".view").forEach((el) => el.classList.toggle("on", el.id === "v-" + v));
  $$(".tabbar button").forEach((b) => b.classList.toggle("on", b.dataset.tab === TAB_OF[v]));
  window.scrollTo(0, 0);
  if (tg && tg.BackButton) { PARENT[v] ? tg.BackButton.show() : tg.BackButton.hide(); }
  if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }
}

/* ---- เสียง / audio ---- */
let player = null, playingBtn = null;
function stopAudio() {
  if (player) { player.pause(); player = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (playingBtn) { playingBtn.classList.remove("playing"); playingBtn.textContent = "▶"; playingBtn = null; }
}
function playTopic(i, btn) {
  const same = playingBtn === btn;
  stopAudio();
  if (same) return;
  const tp = TOPICS[i];
  const done = () => { if (playingBtn === btn) stopAudio(); };
  const src = tp.audio && tp.audio[lang];
  if (src) {
    player = new Audio(src);
    player.onended = done; player.onerror = done;
    player.play().catch(done);
  } else if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
    const u = new SpeechSynthesisUtterance(pick(tp.title) + ". " + tp.points[lang].join(" "));
    u.lang = lang === "th" ? "th-TH" : "en-US";
    u.rate = 0.95;
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  } else {
    alertMsg(t("noVoice"));
    return;
  }
  playingBtn = btn; btn.classList.add("playing"); btn.textContent = "■";
}
function alertMsg(m) { (inTelegram && tg.showAlert) ? tg.showAlert(m) : alert(m); }

/* ---- ฟอร์ม ภ.ท.33 / PT.33 form ---- */
$("#ptForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("#fName").value.trim();
  const age = parseInt($("#fAge").value, 10);
  const phone = $("#fPhone").value.trim();
  const sym = $$("#symptoms input:checked").map((i) => +i.value);
  const err = !name ? "eName" : !(age >= 20) ? "eAge" : !phone ? "ePhone"
    : !sym.length ? "eSym" : !$("#fConsent").checked ? "eConsent" : null;
  $("#ptErr").textContent = err ? t(err) : "";
  if (err) return;

  const data = {
    type: "pt33_request", lang, name, age, phone,
    symptoms: sym.map((i) => I18N.en.symptoms[i]),
    detail: $("#fDetail").value.trim().slice(0, 800),
    meds: $("#fMeds").value.trim().slice(0, 800)
  };
  $("#ptSummary").textContent = [
    `${t("sName")}: ${name}`, `${t("sAge")}: ${age}`, `${t("sPhone")}: ${phone}`,
    `${t("sSym")}: ${sym.map((i) => t("symptoms")[i]).join(", ")}`,
    data.detail ? `${t("sDetail")}: ${data.detail}` : null,
    data.meds ? `${t("sMeds")}: ${data.meds}` : null
  ].filter(Boolean).join("\n");
  $("#ptForm").style.display = "none";
  $("#ptDone").style.display = "block";
  window.scrollTo(0, 0);

  // ส่งข้อมูลกลับไปที่บอท (ทำงานเมื่อเปิดมินิแอพจากปุ่มคีย์บอร์ดของบอท)
  // Sends data to the bot (works when the Mini App is opened from a bot keyboard button)
  if (inTelegram && tg.sendData) { try { tg.sendData(JSON.stringify(data)); } catch (e2) {} }
});
$("#ptAgain").addEventListener("click", () => {
  $("#ptForm").reset(); $("#ptErr").textContent = "";
  $("#ptForm").style.display = "block"; $("#ptDone").style.display = "none";
});

/* ---- events ---- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-go],[data-lang],[data-cat],[data-item],[data-topic],[data-redeem],[data-seg],[data-q],[data-size],[data-filter],[data-cq],[data-pay],[data-method],#oAdd,#cSend");
  if (!el) return;
  if (el.dataset.go) go(el.dataset.go);
  else if (el.dataset.seg) seg(el.dataset.seg);
  else if (el.dataset.q) { order.qty = Math.min(99, Math.max(1, order.qty + +el.dataset.q)); drawOrder(); }
  else if (el.dataset.size) { order.size = +el.dataset.size; drawOrder(); }
  else if (el.dataset.filter) { order.filter = el.dataset.filter; drawOrder(); }
  else if (el.id === "oAdd") addToCart();
  else if (el.dataset.cq) {
    const [i, d] = el.dataset.cq.split(":").map(Number), note = $("#cNote") ? $("#cNote").value : "";
    if (cart[i]) cart[i].qty = Math.min(99, cart[i].qty + d);
    saveCart(); renderCart();
    if ($("#cNote")) $("#cNote").value = note;
  }
  else if (el.dataset.pay || el.dataset.method) {
    const note = $("#cNote").value;
    if (el.dataset.pay) pay = el.dataset.pay; else method = el.dataset.method;
    renderCart(); saveCart(); $("#cNote").value = note;
  }
  else if (el.id === "cSend") sendOrder();
  else if (el.dataset.lang) { lang = el.dataset.lang; store.set("lang", lang); applyLang(); }
  else if (el.dataset.cat) { curCat = el.dataset.cat; go("list"); }
  else if (el.dataset.item) {
    curCat = el.dataset.icat || curCat; curItem = +el.dataset.item;
    order.qty = 1; order.roll = false;
    go("detail");
  }
  else if (el.dataset.topic) playTopic(+el.dataset.topic, el);
  else if (el.dataset.redeem) redeem(el.dataset.redeem);
});
document.addEventListener("change", (e) => {
  if (e.target.id === "oRoll") { order.roll = e.target.checked; drawOrder(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "search") renderSearch();
  else if (e.target.id === "calcIn") {
    const pts = Math.floor(Math.max(0, +e.target.value || 0) / LOYALTY.bahtPerPoint), v = LOYALTY.pointsPerVisit;
    $("#calcOut").textContent = pts ? `${pts.toLocaleString("en-US")} + ${v} = ${(pts + v).toLocaleString("en-US")} ${t("ptsWord")}`
                                    : `= ${v} ${t("ptsWord")}`;
  }
});
$("#gateYes").addEventListener("click", () => { store.set("age20", "1"); $("#gate").style.display = "none"; });
$("#gateNo").addEventListener("click", () => {
  $("#gate .gbox").innerHTML = `<div class="big">🚫</div><p>${esc(t("gateBlocked"))}</p>`;
});

/* ---- start ---- */
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { tg.setHeaderColor("#0d0b07"); tg.setBackgroundColor("#070707"); } catch (e) {}
  if (tg.BackButton) tg.BackButton.onClick(() => go(PARENT[view] || "home"));
}
if (store.get("age20") === "1") $("#gate").style.display = "none";
applyLang();
go("home");

// กติกาแต้มและของรางวัลจาก config.json (ไฟล์เดียวกับที่บอทใช้)
fetch("config.json", { cache: "no-store" }).then((r) => r.ok ? r.json() : null).then((c) => {
  if (!c) return;
  if (c.baht_per_point > 0) LOYALTY.bahtPerPoint = +c.baht_per_point;
  if (c.points_per_visit >= 0) LOYALTY.pointsPerVisit = +c.points_per_visit;
  if (Array.isArray(c.rewards)) LOYALTY.rewards = c.rewards.filter((r) => r && r.id && r.cost > 0 && r.label);
  if (Array.isArray(c.promos)) HOME.promos = c.promos.filter((x) => x && x.title);
  if (Array.isArray(c.events)) HOME.events = c.events.filter((x) => x && x.title);
  CATS.forEach((k) => { PRODUCTS[k.id] = ((c.items || {})[k.id] || []).filter((p) => p && p.id && p.name); });
  const r = c.roll || {};
  if (Array.isArray(r.sizes) && r.sizes.length) SHOP.roll.sizes = r.sizes.map((s) => ({ g: +s.g, fee: +s.fee || 0 })).filter((s) => s.g > 0);
  if (Array.isArray(r.filters) && r.filters.length) SHOP.roll.filters = r.filters.filter((f) => f && f.id && f.label);
  if (r.free_min_grams >= 0) SHOP.roll.freeMinGrams = +r.free_min_grams;
  const gf = c.gift;
  SHOP.gift = gf && gf.label && gf.per_grams > 0 ? { perGrams: +gf.per_grams, minBaht: +gf.min_baht || 0, label: gf.label } : null;
  const dl = c.delivery || {}, ng = dl.night || {};
  SHOP.ship = { pickup: dl.pickup !== false, freeMinBaht: +dl.free_min_baht || 0, freeKm: +dl.free_km || 0,
                perKm: Array.isArray(dl.per_km) && dl.per_km.length === 2 ? dl.per_km.map(Number) : [40, 100],
                night: { from: +ng.from_hour || 0, to: +ng.to_hour || 0, fee: +ng.fee || 0 } };
  if (!SHOP.ship.pickup) method = "delivery";
  const pm = c.payments || {};
  if (Array.isArray(pm.methods) && pm.methods.length) SHOP.pays = pm.methods.filter((m) => ["cash", "qr", "btc", "card"].includes(m));
  if (!SHOP.pays.length) SHOP.pays = ["cash"];
  if (pm.card_fee_percent >= 0) SHOP.cardFeePercent = +pm.card_fee_percent;
  if (!SHOP.pays.includes(pay)) pay = SHOP.pays[0];
  order.size = SHOP.roll.sizes[0].g; order.filter = SHOP.roll.filters[0].id;
  menuLoaded = true;
  applyLang();
}).catch(() => {});
</script>
</body>
</html>
